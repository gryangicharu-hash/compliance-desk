{% extends "base.html" %}{% block title %}Log in · Compliance Desk{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Log in</h1>
  <form method="post" class="f" style="grid-template-columns:1fr;margin-top:14px">{% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <p><button class="btn primary" type="submit">Log in</button></p>
  </form>
</section>
{% endblock %}
