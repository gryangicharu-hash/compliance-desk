name: tests

on:
  push:
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Schema and safeguard checks
        run: |
          createdb compliance_test
          for f in db/schema.sql db/test_schema.sql db/schema_audit_module.sql db/test_audit_module.sql; do
            psql -v ON_ERROR_STOP=1 -d compliance_test -f "$f"
          done
          python db/test_audit_chain.py | psql -v ON_ERROR_STOP=1 -d compliance_test

  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: compliance_desk
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdefghijklmnop
      BLIND_INDEX_KEY: ci-only-blind-index-key-0123456789abcdef
      DJANGO_SECURE_SSL_REDIRECT: "0"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .. -r requirements.txt
        working-directory: web
      - run: python -m pip freeze | grep -i -E "^(django|psycopg|cryptography)"
      - name: Encryption key for this run only
        run: echo "FIELD_ENCRYPTION_KEYS=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"
      - name: Generate any missing migrations
        run: python manage.py makemigrations accounts audittrail members screening cases corebanking monitoring jobs assurance
      - name: Print new migrations (so they can be reviewed and committed)
        run: |
          for f in $(git ls-files --others --exclude-standard -- '*/migrations/*.py'); do
            echo "=====BEGIN $f"; cat "$f"; echo "=====END $f"
          done
      - run: python manage.py check
      - name: Production settings check
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SECURE_SSL_REDIRECT: "1"
      - name: Known vulnerabilities in installed packages
        run: python -m pip install pip-audit && pip-audit --skip-editable
      - run: python manage.py collectstatic --noinput
      - name: Database role without superuser rights, so row-level security really applies
        run: psql -d postgres -c "CREATE ROLE compliance_app LOGIN CREATEDB PASSWORD 'ci-only'"
      - run: python manage.py test --verbosity 2
        env:
          PGUSER: compliance_app
          PGPASSWORD: ci-only
      - name: Backup and restore test (demo data, nightly jobs, dump, restore, verify)
        env:
          PGUSER: compliance_app
          PGPASSWORD: ci-only
        run: |
          createdb compliance_desk
          python manage.py migrate --noinput
          python manage.py createcachetable
          python manage.py seed_demo --yes-this-is-a-demo --members 60
          python manage.py runjobs nightly
          # As in production, pg_dump and pg_restore run inside the database container, so
          # their version always matches the server's.
          cid="${{ job.services.postgres.id }}"
          docker cp ../deploy/backup.sh "$cid":/usr/local/bin/compliance-backup
          docker cp ../deploy/restore.sh "$cid":/usr/local/bin/compliance-restore
          docker exec -e PGUSER=postgres -e BACKUP_DIR=/backups "$cid" bash /usr/local/bin/compliance-backup
          dump="$(docker exec "$cid" sh -c 'ls /backups/*.dump')"
          docker exec -e PGUSER=postgres -w / "$cid" bash /usr/local/bin/compliance-restore "$dump" compliance_restored
          PGDATABASE=compliance_restored python manage.py verify_database
      - name: Migrations must be committed
        run: |
          git status --porcelain -- '*/migrations/*.py'
          test -z "$(git status --porcelain -- '*/migrations/*.py')" || { echo "::error::Commit the generated migrations printed above"; exit 1; }

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the application image
        run: docker build -t compliance-desk:ci .
      - name: Image starts and passes Django's checks
        run: |
          docker run --rm -e DJANGO_SECRET_KEY=ci-only-not-a-real-secret-0123456789abcdefghijklmnop \
            -e FIELD_ENCRYPTION_KEYS=$(python3 -c 'import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())') \
            -e BLIND_INDEX_KEY=ci-only-blind-index-key-0123456789abcdef compliance-desk:ci manage check
      - name: Compose file is valid
        run: cp .env.example .env && sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=x/;s/^PGPASSWORD=$/PGPASSWORD=y/' .env && docker compose config -q
