# Example reverse proxy: TLS in front of the app on 127.0.0.1:8000.
server {
    listen 80;
    server_name compliance.example-sacco.co.ke;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name compliance.example-sacco.co.ke;
    ssl_certificate     /etc/letsencrypt/live/compliance.example-sacco.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/compliance.example-sacco.co.ke/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;          # core banking and list files
    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;          # imports and audit test runs can take a while
    }
}
